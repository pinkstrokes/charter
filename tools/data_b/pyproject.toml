[project]
name = "charter-data-b"
version = "0.1.0"
description = "Builds the company-B accounts-receivable world from UCI Online Retail II"
requires-python = "==3.12.*"
dependencies = [
    "openpyxl==3.1.5",
    "pandas==3.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
