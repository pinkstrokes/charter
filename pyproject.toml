[project]
name = "charter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Terence Zhang", email = "tianzhang@g.hmc.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "cedarpy>=4.12.2",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "ortools>=9.15.6755",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
charter = "charter:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
